[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-rwa"
version = "0.1.0"
description = "AI-assisted ERC-3643 Real World Asset tokenization scaffolder"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Shubham Dusane", email = "sdusane4@gmail.com" }
]
keywords = ["rwa", "erc-3643", "tokenization", "blockchain", "ai", "defi", "web3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.30.0"]
all = ["anthropic>=0.30.0", "openai>=1.30.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "build>=1.2.0", "twine>=5.0.0"]

[project.scripts]
forge = "forge.cli:main"

[project.urls]
Homepage = "https://github.com/shubhamdusane/forge"
Repository = "https://github.com/shubhamdusane/forge"
Issues = "https://github.com/shubhamdusane/forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
